# Java CI: build and test with Maven or Gradle (whichever the project uses).
name: Java CI

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: |
          if [ -f pom.xml ]; then
            mvn -B verify
          elif [ -f gradlew ]; then
            chmod +x gradlew && ./gradlew build
          else
            echo "No pom.xml or gradlew found" && exit 1
          fi
