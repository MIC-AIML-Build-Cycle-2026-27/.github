# Python CI: lint with ruff, test with pytest.
# Add this as a job in .github/workflows/ci.yml, or use it on its own.
# If your code is in a subfolder, set `working-directory` under defaults.run.
name: Python CI

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
